name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest -q

      - name: Run attention benchmark smoke test
        run: >-
          uv run python -m modeling.basics.benchmark_kv_cache
          --device cpu
          --batch-size 1
          --seq-len 8
          --d-model 32
          --n-heads 4
          --warmup 0
          --iters 1
