[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-playground"
version = "0.1.0"
description = "Machine Learning Playground with LLM Embedding Demos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.30.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "scikit-image>=0.22.0",
    "pandas>=2.2.0",
    "huggingface-hub>=0.24.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "wandb>=0.21.1",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "sentencepiece>=0.2.0",
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
tinker = [
    "tinker>=0.23.2 ; python_full_version >= '3.11'",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["modeling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
